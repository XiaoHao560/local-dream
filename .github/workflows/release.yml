name: Create Release from Tag

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout your project
        uses: actions/checkout@v4
        with:
          submodules: false
          lfs: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 获取上游 Release 的 APK 下载链接（排除 with_filter）
      - name: Get upstream release asset URL
        id: get_release
        run: |
          REPO="xororz/local-dream"
          TAG=""

          AUTH_HEADER="Authorization: token ${{ secrets.GITHUB_TOKEN }}"
          USER_AGENT="User-Agent: GitHub-Action"

          echo "Fetching latest release from $REPO..."
          RELEASE_INFO=$(curl -s -H "$AUTH_HEADER" -H "$USER_AGENT" "https://api.github.com/repos/$REPO/releases/latest")

          if [ -z "$RELEASE_INFO" ] || [ "$RELEASE_INFO" = "null" ]; then
            echo "::error::Failed to fetch release info"
            exit 1
          fi

          APK_URL=$(echo "$RELEASE_INFO" | jq -r '.assets[] | select(.name | contains("armv8a") and (contains("with_filter") | not)) | .browser_download_url' | head -n 1)

          if [ -z "$APK_URL" ] || [ "$APK_URL" = "null" ]; then
            echo "::error::No arm64-v8a APK (without 'with_filter') found"
            exit 1
          fi

          echo "APK_URL=$APK_URL" >> $GITHUB_OUTPUT
          echo "Found APK: $APK_URL"

      # 下载并解压 APK
      - name: Download and extract upstream APK
        run: |
          APK_URL="${{ steps.get_release.outputs.APK_URL }}"
          curl -L -o upstream.apk "$APK_URL"
          mkdir -p upstream-extract
          unzip -q upstream.apk -d upstream-extract
          echo "Extracted contents:"
          ls -l upstream-extract/ | head -20

      # 复制 native 库和 assets
      - name: Copy native files to project
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/assets/qnnlibs

          if [ -f "upstream-extract/lib/arm64-v8a/libstable_diffusion_core.so" ]; then
            cp -v upstream-extract/lib/arm64-v8a/libstable_diffusion_core.so app/src/main/jniLibs/arm64-v8a/
          else
            echo "::error::libstable_diffusion_core.so not found"
            exit 1
          fi

          if [ -d "upstream-extract/assets/qnnlibs" ]; then
            cp -v upstream-extract/assets/qnnlibs/*.so app/src/main/assets/qnnlibs/
          else
            echo "::error::qnnlibs directory not found"
            exit 1
          fi

          echo "=== jniLibs ==="
          ls -l app/src/main/jniLibs/arm64-v8a/
          echo "=== assets/qnnlibs ==="
          ls -l app/src/main/assets/qnnlibs/

      - name: Grant gradlew permission
        run: chmod +x gradlew

      # Gradle 打包
      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      # 解码密钥库到 app/ 目录
      - name: Decode Keystore
        run: |
          echo "${{ secrets.RELEASE_STORE_FILE }}" | base64 --decode > app/keystore.jks
          ls -l app/keystore.jks
          
      # 修改软件包名
      - name: Change application ID
        run: |
          NEW_ID="io.github.xiaohao.localdream"
          sed -i 's/applicationId = ".*"/applicationId = "'$NEW_ID'"/' app/build.gradle.kts

      - name: Build release APK
        run: |
          ./gradlew assembleBasicRelease -x ktlintCheck -x detekt --quiet
        env:
          ORG_GRADLE_PROJECT_RELEASE_STORE_FILE: keystore.jks
          ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      # 创建 GitHub Release
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/basic/release/*.apk
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}